<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MMO admin</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 2rem; background: #111; color: #ddd; }
    h1 { font-size: 1.2rem; }
    form, .cards { display: flex; gap: .75rem; flex-wrap: wrap; align-items: end; margin-bottom: 1rem; }
    label { display: flex; flex-direction: column; font-size: .8rem; gap: .2rem; }
    input, button { font: inherit; padding: .35rem .5rem; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; }
    button { cursor: pointer; }
    .card { background: #1b1b1b; border: 1px solid #333; border-radius: 6px; padding: .6rem .9rem; min-width: 8rem; }
    .card b { display: block; font-size: 1.3rem; }
    .lvl0 { color: #6c6; } .lvl1 { color: #dd5; } .lvl2 { color: #e93; } .lvl3 { color: #e55; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #2a2a2a; }
    #log { color: #aaa; font-size: .8rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>MMO admin</h1>
  <form id="connect">
    <label>Server <input id="uri" value="ws://127.0.0.1:3000" size="28" /></label>
    <label>Database <input id="db" value="mmo-dev" size="14" /></label>
    <button type="submit">Connect</button>
    <span id="who"></span>
  </form>
  <div class="cards" id="cards"></div>
  <form id="admin" hidden>
    <button type="button" id="open">Open admission</button>
    <button type="button" id="close">Close admission</button>
    <label>Identity (0x...) <input id="ident" size="40" /></label>
    <button type="button" id="allow">Allow</button>
    <button type="button" id="revoke">Revoke</button>
  </form>
  <table>
    <thead><tr><th>Name</th><th>Online</th><th>Position</th><th>Cell</th><th>Identity</th></tr></thead>
    <tbody id="players"></tbody>
  </table>
  <div id="log"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
