[package]
name = "mmo_server"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to match stdb.lock. Bump the CLI, the server, this crate and every client SDK together.
spacetimedb = "=2.14.0"
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
